<style>
#dsp{--t1:var(--text-primary,#1a1a1a);--t2:var(--text-secondary,#5f5e5a);--t3:var(--text-muted,#888780);--bd:var(--border,rgba(0,0,0,.12));--bd2:var(--border-strong,rgba(0,0,0,.22));--sf:var(--surface-2,#fff);--sf1:var(--bg-neutral,#f4f3ef);--acc:var(--border-accent,#378ADD);--accbg:var(--bg-accent,#E6F1FB);--acct:var(--text-accent,#185FA5);font-family:var(--font-sans,system-ui,-apple-system,"Pretendard","Apple SD Gothic Neo",sans-serif);color:var(--t1);padding:.5rem 0 1rem}
#dsp .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#dsp .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
#dsp .lbl{font-size:12px;color:var(--t2);margin:0 4px 0 0;min-width:64px}
#dsp .chip{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;border:.5px solid var(--bd2);background:transparent;color:var(--t1);cursor:pointer}
#dsp .chip.on{background:var(--accbg);color:var(--acct);border-color:var(--acc)}
#dsp input[type=text]{flex:1;min-width:160px;font:inherit;font-size:13px}
#dsp .box{border:.5px solid var(--bd);border-radius:12px;background:var(--sf);padding:12px;margin:12px 0}
#dsp .box h3{font-size:14px;font-weight:500;margin:0 0 8px}
#dsp .empty{font-size:13px;color:var(--t2);margin:0}
#dsp .cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
#dsp .cc .nm{display:flex;align-items:center;gap:6px;margin:8px 0 6px;font-size:14px;font-weight:500}
#dsp .cc .nm small{font-weight:400;color:var(--t2);font-size:12px}
#dsp .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accbg);color:var(--acct);border:.5px solid var(--acc)}
#dsp .acts{display:flex;gap:6px;flex-wrap:wrap}
#dsp .btn{font:inherit;font-size:12px;padding:5px 12px;border-radius:8px;border:.5px solid var(--bd2);background:transparent;color:var(--t1);cursor:pointer}
#dsp .btn.on,#dsp .btn.go{background:var(--accbg);color:var(--acct);border-color:var(--acc)}
#dsp .btn.go{font-size:13px;padding:7px 14px}
#dsp .selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--bd);font-size:13px}
#dsp .selbar .pk{flex:1;min-width:180px;color:var(--t2)}
#dsp .selbar .pk b{color:var(--t1);font-weight:500}
#dsp .msg{font-size:12px;color:var(--t2);width:100%;margin:4px 0 0}
#dsp .err{color:var(--text-danger,#A32D2D)}
#dsp .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
#dsp .card{border:.5px solid var(--bd);border-radius:12px;background:var(--sf);cursor:pointer;overflow:hidden;position:relative;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%}
#dsp .card:hover{border-color:var(--bd2)}
#dsp .card.pk{outline:2px solid var(--acc);outline-offset:-1px}
#dsp .meta{padding:7px 10px 9px}
#dsp .ko{font-size:13px;font-weight:500;margin:0}
#dsp .en{font-size:11px;color:var(--t2);margin:1px 0 2px}
#dsp .hint{font-size:11px;color:var(--t3);margin:0}
#dsp .ck{position:absolute;top:6px;right:6px;z-index:5;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sf);color:var(--t2);border:.5px solid var(--bd2)}
#dsp .card.pk .ck{background:var(--accbg);color:var(--acct);border-color:var(--acc)}
#dsp .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--t2)}
.vp{position:relative;overflow:hidden;width:100%;aspect-ratio:4/3}
.t-slide .vp{aspect-ratio:16/9}.t-poster .vp{aspect-ratio:4/5}
.sc{position:absolute;top:0;left:0;width:320px;height:240px;transform-origin:0 0;transform:scale(var(--s,.5));display:flex;flex-direction:column;gap:8px;padding:16px;box-sizing:border-box;overflow:hidden;text-align:left}
.t-slide .sc{height:180px;justify-content:center;padding:20px 24px}.t-poster .sc{width:240px;height:300px;justify-content:flex-end;padding:22px}
.sc>*{position:relative;z-index:1;margin:0}
.nv{display:flex;justify-content:space-between;align-items:center;font-size:11px}.nv i{font-style:normal;display:flex;gap:10px}
.h{font-size:26px;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;margin-top:4px}
.p{font-size:12px}
.b{align-self:flex-start;font-size:12px;padding:6px 14px}
.cs{display:flex;gap:8px;margin-top:auto}.cs div{flex:1;height:52px}
.st,.dt{display:none}
.t-slide .nv,.t-slide .cs,.t-slide .b,.t-poster .nv,.t-poster .cs{display:none}
.t-slide .st{display:block;font-size:38px;font-weight:800;line-height:1}.t-slide .h{font-size:24px}
.t-poster .dt{display:block;font-size:11px;letter-spacing:.15em}.t-poster .h{font-size:34px}
</style>

:"Design style picked → main: "+lab(main)+(sub?", secondary: "+lab(sub):"")+". Use: "+u[tpl]+"."+(txt?" Headline: "+txt+".":"")+" Please write the prompt for this combo.";
